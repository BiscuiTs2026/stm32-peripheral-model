name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: 主机单测
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 配置
        run: cmake -S tests/host -B build-host
      - name: 构建
        run: cmake --build build-host --config Release
      - name: 运行（CTest）
        # 该命令已在本地 Windows 实测（1/1 通过）；作为 Actions 步骤尚未在 CI 中跑过。
        run: ctest --test-dir build-host -C Release --output-on-failure

  firmware:
    name: 固件构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装构建工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
      - name: 下载固定版本 arm-none-eabi-gcc（14.3.rel1）
        # 与 README「构建」声明的 14.x 对齐；升级时同步改这里的版本号与 README。
        # 未在本地实测：该下载地址与工具链包本地无法获取，首次生效以 CI 结果为准。
        run: |
          curl -fsSL -o /tmp/arm-gnu.tar.xz \
            https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
          tar -xJf /tmp/arm-gnu.tar.xz -C "$GITHUB_WORKSPACE"
          "$GITHUB_WORKSPACE/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi/bin/arm-none-eabi-gcc" --version | head -1
      - name: 配置
        run: |
          cmake -S . -B build-arm -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/arm-gcc-toolchain.cmake" \
            -DTOOLCHAIN_ROOT="$GITHUB_WORKSPACE/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi/bin"
      - name: 构建
        run: cmake --build build-arm

  layering:
    name: 四层架构检查（版本不漂移 + ERROR 必须为 0）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查器版本漂移
        # 文件头 source-commit / checker-version / source-repo 与 tools/CHECKER.lock 任一不一致即失败（退出码 1）。
        run: python3 tools/check_layering.py --version --lock tools/CHECKER.lock
      - name: 运行检查器
        # 退出码即门禁：0 = 无 ERROR，1 = 有 ERROR。WARN 只打印，不改变退出码。
        run: python3 tools/check_layering.py . --roles .arch-roles
